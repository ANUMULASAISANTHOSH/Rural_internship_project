data_sources:
  - id: "SRC-DEM-COP30"
    name: "Copernicus Digital Elevation Model GLO-30"
    category: "dem"
    provider: "European Space Agency (ESA) / European Union Copernicus Programme"
    url: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N17_00_E078_00_DEM/Copernicus_DSM_COG_10_N17_00_E078_00_DEM.tif"
    license: "Open Data (ODC-BY / Copernicus Open Access)"
    format: "Cloud-Optimized GeoTIFF (COG)"
    crs: "EPSG:4326"
    resolution: "30-metre (1 arc-second)"
    provenance: "OBSERVED"
    target_raw_path: "data/raw/dem/Copernicus_DSM_COG_10_N17_00_E078_00_DEM.tif"
    notes: "Tile N17E078 covering 17N-18N, 78E-79E. Acquired via TanDEM-X radar mission."

