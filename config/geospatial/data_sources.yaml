  - id: "SRC-TGDPS-RAIN-HIST"
    name: "TGDPS / IMD Historical Storm Observations (October 2020)"
    category: "rainfall"
    provider: "Telangana Development Planning Society / India Meteorological Department"
    url: "https://tsdps.telangana.gov.in/"
    license: "Public Government Weather Archive"
    format: "CSV"
    crs: "EPSG:4326"
    resolution: "Hourly Weather Station Records"
    provenance: "HISTORICAL"
    target_raw_path: "data/raw/rainfall/historical_october_2020_rainfall.csv"
    notes: "Observations from Begumpet (IMD), Gachibowli (TGDPS), Serilingampally (TGDPS), and Rajendranagar (TGDPS)."

  - id: "SRC-SCN-RAIN-SIM"
    name: "AQUILA Synthetic Design Storm Hyetograph (120mm / 3hr)"
    category: "rainfall"
    provider: "AQUILA Hydrological Modeling Team"
    url: "Internal Algorithm / Synthetic Specification"
    license: "Academic Project Open Data"
    format: "CSV"
    crs: "N/A (Temporal Time-Series)"
    resolution: "15-minute Time Steps"
    provenance: "SIMULATED"
    target_raw_path: "data/raw/rainfall/synthetic_120mm_storm_hyetograph.csv"
    notes: "Scientifically calibrated Chicago design storm profile peaking at 70 mm/hr."

  - id: "SRC-NRSC-FLOOD-2020"
    name: "NRSC Bhuvan Flood Inundation Evidence (October 2020)"
    category: "flood_evidence"
