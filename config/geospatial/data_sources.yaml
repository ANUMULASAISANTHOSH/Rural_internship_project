    provenance: "HISTORICAL"
    target_raw_path: "data/raw/flood_evidence/historical_flood_points_oct2020.geojson"
    notes: "Documented waterlogging and inundation points across western Hyderabad corridor."

  - id: "SRC-MONITOR-LOCS"
